spring.application.name=organizaai

spring.datasource.url=jdbc:h2:mem:organizaai;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-key-not-for-production-use-only-for-tests
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=http://localhost:4200
app.cookie.secure=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

app.admin.notification-email=
