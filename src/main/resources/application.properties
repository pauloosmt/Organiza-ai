spring.application.name=organizaai

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizaai}
spring.datasource.username=${DB_USERNAME:organizaai}
spring.datasource.password=${DB_PASSWORD:organizaai}
# O Postgres gratuito da Render tambem hiberna por inatividade; sem isso, se ele
# nao acordar a tempo do valor padrao (30s), o boot inteiro falha ao tentar
# autodetectar o dialeto (erro "Unable to determine Dialect without JDBC metadata").
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.main.lazy-initialization=true NAO adia a criacao do EntityManagerFactory:
# o Spring Data JPA valida os repositorios contra o banco no boot por padrao,
# independente do lazy-init geral. Isso faz o app inteiro falhar ao subir se o
# banco estiver inalcancavel no momento do deploy. Adiando esse bootstrap, o app
# consegue subir e responder ao health check mesmo com o banco fora do ar; só
# falha de verdade quando algo tenta usar o banco pela primeira vez.
spring.data.jpa.repositories.bootstrap-mode=deferred

app.jwt.secret=${JWT_SECRET:change-this-development-only-secret-must-be-long-enough}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# A Render usa /actuator/health pra decidir se um deploy novo esta saudavel. Se
# esse endpoint depender do Postgres (que tambem hiberna e pode nao acordar a
# tempo), o deploy fica preso em "timeout esperando health check" mesmo com o
# app totalmente de pe. Desacopla a checagem de saude do banco por esse motivo.
management.health.db.enabled=false

spring.main.lazy-initialization=true
spring.jmx.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}
