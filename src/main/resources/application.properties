spring.application.name=organizaai

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizaai}
spring.datasource.username=${DB_USERNAME:organizaai}
spring.datasource.password=${DB_PASSWORD:organizaai}

spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:change-this-development-only-secret-must-be-long-enough}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.main.lazy-initialization=true
spring.jmx.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}
