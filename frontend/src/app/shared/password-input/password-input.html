<div class="password-input">
  <input
    [id]="inputId"
    [type]="visivel() ? 'text' : 'password'"
    [value]="valor()"
    [autocomplete]="autocomplete"
    [placeholder]="placeholder"
    [disabled]="desabilitado()"
    (input)="aoDigitar($any($event.target).value)"
    (blur)="aoPerderFoco()"
  />
  <button
    type="button"
    class="toggle"
    tabindex="-1"
    (click)="alternarVisibilidade()"
    [attr.aria-label]="visivel() ? 'Ocultar senha' : 'Mostrar senha'"
  >
    @if (visivel()) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-2.39 3.53M14.12 14.12a3 3 0 1 1-4.24-4.24" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
