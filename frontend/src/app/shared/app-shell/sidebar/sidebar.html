<aside class="sidebar">
  <a routerLink="/" class="brand">
    <app-brand-emblem [size]="30" color="#ffffff" />
    <span class="wordmark">ORGANIZA<span class="chip">aí</span></span>
  </a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Início">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" />
      </svg>
      <span class="label">Início</span>
    </a>
    <a routerLink="/disciplinas" routerLinkActive="active" aria-label="Disciplinas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 4.5h7a2.5 2.5 0 0 1 2.5 2.5v13a2 2 0 0 0-2-2H2z" /><path d="M22 4.5h-7a2.5 2.5 0 0 0-2.5 2.5v13a2 2 0 0 1 2-2h7z" />

      <span class="label">Disciplinas</span>
    </a>
    <a routerLink="/grade" routerLinkActive="active" aria-label="Grade">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="1.5" /><rect x="13" y="3" width="8" height="8" rx="1.5" /><rect x="3" y="13" width="8" height="8" rx="1.5" /><rect x="13" y="13" width="8" height="8" rx="1.5" />

    </a>
    <a routerLink="/premium" routerLinkActive="active" aria-label="Premium">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8l4 3 5-7 5 7 4-3-2 11H5z" />
      </svg>
      <span class="label">Premium</span>
    </a>
  </nav>
</aside>
