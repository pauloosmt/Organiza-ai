<form [formGroup]="form" (ngSubmit)="submit()">
  <input type="text" formControlName="titulo" placeholder="Título (ex: Prova 1)" />
  <div class="linha-form">
    <select formControlName="tipo">
      <option value="PROVA">Prova</option>
      <option value="TRABALHO">Trabalho</option>
      <option value="RECUPERACAO">Recuperação</option>
      <option value="ATIVIDADE">Atividade</option>
    </select>
    <app-date-picker-br formControlName="data" />
    <input
      type="number"
      step="1"
      min="1"
      formControlName="pontuacao"
      [placeholder]="tipoAtual() === 'ATIVIDADE' ? 'Pontuação (opcional)' : 'Pontuação'"
    />
  </div>
  @if (erro()) {
    <p class="error">{{ erro() }}</p>
  }
  <div class="acoes">
    <button type="submit" [disabled]="form.invalid">{{ avaliacao ? 'Salvar' : 'Adicionar avaliação' }}</button>
    @if (avaliacao) {
      <button type="button" class="cancelar" (click)="cancelar()">Cancelar</button>
    }
  </div>
</form>
