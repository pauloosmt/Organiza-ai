<app-auth-layout>
  <p class="eyebrow">Bem-vindo de volta</p>
  <h1>Entrar</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="voce@faculdade.edu.br" />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="switch">Não tem conta? <a routerLink="/register">Cadastre-se</a></p>
</app-auth-layout>
