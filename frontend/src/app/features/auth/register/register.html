<app-auth-layout>
  <p class="eyebrow">Comece agora</p>
  <h1>Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">Nome</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" placeholder="Seu nome" />
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <app-password-input inputId="password" formControlName="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
    </div>

    <div class="field">
      <label for="confirmarSenha">Confirmar senha</label>
      <app-password-input inputId="confirmarSenha" formControlName="confirmarSenha" autocomplete="new-password" placeholder="••••••••" />
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Enviando...' : 'Criar conta' }}
    </button>
  </form>

  <p class="switch">Já tem conta? <a routerLink="/login">Entrar</a></p>
</app-auth-layout>
